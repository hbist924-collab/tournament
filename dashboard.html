<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2c3e50; --gold: #f1c40f; --danger: #e74c3c; --success: #27ae60; }
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; padding-bottom: 70px; overflow-x: hidden; }
        
        /* Custom Toast System */
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 5000; left: 50%; bottom: 100px; transform: translateX(-50%); font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 100px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 100px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        #loadingOverlay { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .header { background: var(--primary); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .balance-box { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--gold); }
        .customer-btn { font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .game-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .game-card img { width: 100%; height: 100px; object-fit: cover; }
        .game-card h3 { margin: 8px 0; font-size: 0.9rem; }
        .play-btn { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; width: 85%; font-weight: bold; transition: 0.3s; }
        .play-btn:active { transform: scale(0.95); }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 85%; max-width: 400px; padding: 25px; border-radius: 20px; text-align: center; position: relative; }
        .support-links a { display: block; padding: 12px; margin: 10px 0; text-decoration: none; color: white; border-radius: 8px; font-weight: bold; }
        
        /* Spin Wheel Styles */
        .wheel-outer { position: relative; width: 220px; height: 220px; margin: 20px auto; }
        .wheel-container { width: 100%; height: 100%; border: 8px solid #333; border-radius: 50%; position: relative; overflow: hidden; transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        .wheel-img { width: 100%; height: 100%; position: absolute; border-radius: 50%; background: conic-gradient(#e74c3c 0deg 60deg, #f1c40f 60deg 120deg, #27ae60 120deg 180deg, #2980b9 180deg 240deg, #8e44ad 240deg 300deg, #e67e22 300deg 360deg); }
        .number { position: absolute; width: 100%; height: 100%; text-align: center; color: white; font-weight: bold; font-size: 1.1rem; padding-top: 15px; transform-origin: 50% 50%; z-index: 5; }
        .n1 { transform: rotate(30deg); } .n2 { transform: rotate(90deg); } .n3 { transform: rotate(150deg); } 
        .n4 { transform: rotate(210deg); } .n5 { transform: rotate(270deg); } .n6 { transform: rotate(330deg); }
        .needle { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #333; z-index: 2050; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { text-align: center; color: #777; font-size: 0.8rem; text-decoration: none; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="toast">सूचना...</div>

    <div id="loadingOverlay">
        <div><i class="fas fa-spinner fa-spin"></i> Loading...</div>
    </div>

    <header class="header">
        <div class="customer-btn" onclick="toggleModal('supportModal')">
            <i class="fas fa-headset"></i> Support
        </div>
        <div class="balance-box">
            <i class="fas fa-wallet" style="color: var(--gold);"></i> रू <span id="userBalance">0.00</span>
        </div>
    </header>

    <main class="game-grid">
        <div class="game-card"><img src="https://i.ibb.co/GvfdCh8y/images.jpg"><h3>Ludo King</h3><button class="play-btn" onclick="openMatchModal('Ludo King')">Play Now</button></div>
        <div class="game-card"><img src="https://i.ibb.co/chgx7WP7/download.jpg"><h3>PUBG</h3><button class="play-btn" onclick="openMatchModal('PUBG')">Play Now</button></div>
        <div class="game-card"><img src="https://i.ibb.co/HT41RmqB/images-3.jpg"><h3>Free Fire</h3><button class="play-btn" onclick="openMatchModal('Free Fire')">Play Now</button></div>
        <div class="game-card"><img src="https://i.ibb.co/YBnVSZV1/download-1.jpg"><h3>Carrom</h3><button class="play-btn" onclick="openMatchModal('Carrom')">Play Now</button></div>
        <div class="game-card"><img src="https://i.ibb.co/397kdSqt/1775469473110.png"><h3>Normal Spin</h3><button class="play-btn" onclick="openSpinModal('normal')">Spin (रू 5)</button></div>
        <div class="game-card"><img src="https://i.ibb.co/cchmBptQ/1775469646433.png"><h3>Big Spin</h3><button class="play-btn" onclick="openSpinModal('big')">Big Spin (रू 10)</button></div>
    </main>

    <div id="supportModal" class="modal">
        <div class="modal-content">
            <h3>Customer Service</h3>
            <div class="support-links">
                <a href="https://wa.me/9744706803" target="_blank" style="background: #25D366;"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                <a href="https://t.me/watchads11" target="_blank" style="background: #0088cc;"><i class="fab fa-telegram"></i> Telegram</a>
                <button onclick="toggleModal('supportModal')" class="play-btn" style="background:#555; width: 100%; margin-top: 10px;">Close</button>
            </div>
        </div>
    </div>

    <div id="matchModal" class="modal">
        <div class="modal-content">
            <h3 id="matchTitle">Create Match</h3>
            <input type="number" id="entryAmount" placeholder="Entry Amount (Min 10)">
            <input type="text" id="roomCode" placeholder="Room Code">
            <p style="font-size: 0.75rem; color: #e74c3c; font-weight: bold; margin-bottom: 15px;">Admin Commission: 15%</p>
            <button id="createMatchBtn" class="play-btn" style="background: var(--success); width: 100%;">Create Match</button>
            <button onclick="toggleModal('matchModal')" class="play-btn" style="background:#555; width: 100%; margin-top: 8px;">Cancel</button>
        </div>
    </div>

    <div id="spinModal" class="modal">
        <div class="modal-content">
            <h3 id="spinDisplayTitle" style="margin-top: 0;">Lucky Spin</h3>
            <div class="wheel-outer">
                <div class="needle"></div>
                <div class="wheel-container" id="wheelWrapper">
                    <div class="wheel-img"></div>
                    <div id="slot1" class="number n1">?</div>
                    <div id="slot2" class="number n2">?</div>
                    <div id="slot3" class="number n3">?</div>
                    <div id="slot4" class="number n4">?</div>
                    <div id="slot5" class="number n5">?</div>
                    <div id="slot6" class="number n6">?</div>
                </div>
            </div>
            <div id="spinResultText" style="margin: 15px; font-size: 1.3rem; font-weight: bold; color: var(--success); height: 30px;"></div>
            <button id="spinStartBtn" class="play-btn" style="background: var(--success); width: 100%; font-size: 1.1rem;">START SPIN</button>
            <button id="spinCloseBtn" onclick="toggleModal('spinModal')" class="play-btn" style="background:#555; width: 100%; margin-top: 8px;">Close</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item active"><i class="fas fa-home"></i><br>Home</a>
        <a href="matches.html" class="nav-item"><i class="fas fa-gamepad"></i><br>Matches</a>
        <a href="notice.html" class="nav-item"><i class="fas fa-bullhorn"></i><br>Notice</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><br>Profile</a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, update, push, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmrsJq_hxoaSwbl_Y8U8eOZdTVBb0fBIo",
            authDomain: "ludo-king-b051a.firebaseapp.com",
            projectId: "ludo-king-b051a",
            storageBucket: "ludo-king-b051a.firebasestorage.app",
            messagingSenderId: "311482948017",
            appId: "1:311482948017:web:4a986ca1416b6e456e0590"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentBalance = 0;
        let spinning = false;
        let selectedGame = "";

        // UI Toast Function
        window.showToast = (msg) => {
            const t = document.getElementById("toast");
            t.innerText = msg; t.className = "show";
            setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
        };

        window.toggleModal = (id) => {
            if(spinning) return;
            const m = document.getElementById(id);
            if(m) m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        window.openMatchModal = (game) => {
            selectedGame = game;
            document.getElementById('matchTitle').innerText = game + " Create Match";
            toggleModal('matchModal');
        }

        window.openSpinModal = (type) => {
            const prizes = (type === 'normal') ? [0, 2, 5, 7, 10, 15] : [0, 5, 10, 15, 20, 50];
            const fee = (type === 'normal') ? 5 : 10;
            
            document.getElementById('spinDisplayTitle').innerText = (type === 'normal') ? "Normal Spin (रू 5)" : "Big Spin (रू 10)";
            document.getElementById('spinResultText').innerText = "";
            
            prizes.forEach((val, index) => {
                document.getElementById(`slot${index+1}`).innerText = val;
            });

            document.getElementById('spinStartBtn').onclick = () => startSpinProcess(type, fee, prizes);
            toggleModal('spinModal');
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loadingOverlay').style.display = 'none';
                onValue(ref(db, 'users/' + user.uid), (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        currentBalance = data.balance || 0;
                        document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
                    }
                });
            } else { window.location.href = "index.html"; }
        });

        async function startSpinProcess(type, fee, prizes) {
            if(spinning) return;
            if(currentBalance < fee) return showToast("ब्यालेन्स पुगेन!");
            
            spinning = true;
            const user = auth.currentUser;
            const wheel = document.getElementById('wheelWrapper');
            const btn = document.getElementById('spinStartBtn');
            const closeBtn = document.getElementById('spinCloseBtn');
            const userRef = ref(db, 'users/' + user.uid);

            await update(userRef, { balance: Number((currentBalance - fee).toFixed(2)) });

            btn.style.visibility = "hidden";
            closeBtn.style.visibility = "hidden";
            document.getElementById('spinResultText').innerText = "घुम्दैछ...";

            const userSnap = await get(userRef);
            const spinCount = userSnap.val().spinCount || 0;

            let stopAt;
            if (spinCount === 0) {
                let winners = [];
                prizes.forEach((p, i) => { if(p > fee) winners.push(i); });
                stopAt = winners[Math.floor(Math.random() * winners.length)];
            } else {
                let losers = [];
                prizes.forEach((p, i) => { if(p <= fee) losers.push(i); });
                stopAt = losers[Math.floor(Math.random() * losers.length)];
            }

            const angles = [30, 90, 150, 210, 270, 330];
            const targetAngle = angles[stopAt];
            const totalRot = (360 * 5) - targetAngle; 
            
            wheel.style.transition = "transform 4s cubic-bezier(0.15, 0, 0.15, 1)";
            wheel.style.transform = `rotate(${totalRot}deg)`;

            setTimeout(async () => {
                const winAmount = prizes[stopAt];
                const latestSnap = await get(userRef);
                const latestBal = latestSnap.val().balance || 0;

                await update(userRef, { 
                    balance: Number((latestBal + winAmount).toFixed(2)),
                    spinCount: spinCount + 1 
                });

                document.getElementById('spinResultText').innerText = "जित: रू " + winAmount;
                
                setTimeout(() => {
                    spinning = false;
                    btn.style.visibility = "visible";
                    closeBtn.style.visibility = "visible";
                    btn.innerText = "फेरि खेल्नुहोस्";
                    wheel.style.transition = "none";
                    wheel.style.transform = `rotate(${-targetAngle}deg)`;
                }, 1000);
            }, 4000);
        }

        document.getElementById('createMatchBtn').onclick = () => {
            const amt = parseFloat(document.getElementById('entryAmount').value);
            const code = document.getElementById('roomCode').value.trim();
            const user = auth.currentUser;

            if (amt < 10 || isNaN(amt)) return showToast("न्यूनतम रू १० आवश्यक छ!");
            if (!code) return showToast("Room Code अनिवार्य छ!");
            if (currentBalance < amt) return showToast("ब्यालेन्स पर्याप्त छैन!");

            const newMatchKey = push(ref(db, 'matches')).key;
            const matchData = {
                game: selectedGame, entry: amt,
                prize: parseFloat((amt * 1.85).toFixed(2)),
                roomCode: code, creatorId: user.uid,
                status: 'open', time: Date.now()
            };

            const updates = {};
            updates['/matches/' + newMatchKey] = matchData;
            updates['/users/' + user.uid + '/balance'] = Number((currentBalance - amt).toFixed(2));

            update(ref(db), updates).then(() => {
                showToast("Match सफलतापूर्वक सिर्जना भयो!");
                toggleModal('matchModal');
            });
        };
    </script>
</body>
</html>
